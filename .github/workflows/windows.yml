name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test Core, Renderer and App infrastructure
        shell: pwsh
        run: ./Windows/ci/test-windows.ps1
      - name: Publish self-contained x64 editor
        shell: pwsh
        working-directory: Windows/ci
        run: dotnet publish ../src/Compositor.App/Compositor.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishProfile=Portable-x64 -o ../artifacts/ci-publish/app
      - name: Publish self-contained x64 MCP server
        shell: pwsh
        working-directory: Windows/ci
        run: dotnet publish ../tools/Compositor.Mcp/Compositor.Mcp.csproj -c Release -r win-x64 --self-contained true -p:PublishProfile=Portable-x64 -o ../artifacts/ci-publish/mcp
      - name: Check MCP tool discovery
        shell: pwsh
        run: node Windows/tools/verify-editor-mcp.mjs Windows/artifacts/ci-publish/mcp/Compositor.Mcp.exe
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: Windows/artifacts/ci-test-results/*.trx
          if-no-files-found: warn
          retention-days: 7
